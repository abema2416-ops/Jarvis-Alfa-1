name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: engine-cache
          key: engine-${{ github.run_id }}
          restore-keys: engine-
      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Jarvis-APK
          path: |
            build/Jarvis.apk
            build-full.log
          if-no-files-found: ignore
